<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clutch Series Draft Ticker</title>
<script src="/socket.io/socket.io.js"></script>

<style>
  body {
    margin: 0;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
  }

  /* --- TICKER BAR --- */
  .ticker-bar {
    position: fixed;
    bottom: 0;
    width: 100%;
    height: 90px;
    background: #e6e6e6;
    display: flex;
    align-items: center;
    overflow: hidden;
    z-index: 1000;
    box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
  }

  /* --- INFO BOX (Left Side) --- */
  .info-box {
    width: 280px; 
    height: 100%;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 0;
    box-shadow: 2px 0 8px rgba(0, 0, 0, 0.25);
    transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    transform: translateX(0); 
    position: relative;
    z-index: 20;
  }

  .info-box.hidden-start {
    transform: translateX(-120%); 
    opacity: 0;
  }

  .top-row {
    font-family: 'Verdana', sans-serif;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 10px; 
    margin-bottom: 0px;
    text-shadow: 1px 1px 0 #000, 0 0 5px rgba(0,0,0,0.5);
  }

  .middle-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin-top: 2px;
    margin-bottom: 0px;
  }

  #pickText {
    font-family: 'Arial Black', 'Impact', sans-serif;
    font-size: 22px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-shadow: 
      -1px -1px 0 #000, 1px -1px 0 #000,
      -1px  1px 0 #000, 1px  1px 0 #000,
       2px  2px 4px rgba(0,0,0,0.5);
  }

  .team-logo {
    height: 38px;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
  }

  .timer {
    font-family: 'Courier New', monospace; 
    font-size: 26px;
    font-weight: 900;
    margin-top: -2px; 
    margin-bottom: 8px; 
    text-shadow: 
      -1px -1px 0 #000, 1px -1px 0 #000,
      -1px  1px 0 #000, 1px  1px 0 #000;
  }
  
  .timer.warning { color: #ffeb3b; animation: pulse 1s infinite; }
  .timer.critical { color: #ff1744; animation: pulse 0.5s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .info-box.collapsed {
    width: 180px;
    padding: 0;
    justify-content: center;
  }

  .info-box.expanded {
    width: calc(100% - 100px);
    flex-direction: row;
    justify-content: flex-start;
    align-items: center;
    padding: 0 20px;
    gap: 15px;
  }

  .expanded-text {
    display: flex;
    align-items: center;
    gap: 15px;
    font-family: 'Arial Black', sans-serif;
    font-size: 32px; 
    font-weight: 900;
    white-space: nowrap;
    text-transform: uppercase;
    text-shadow: 
      -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000,
      3px 3px 5px rgba(0,0,0,0.5);
  }

  /* --- MIDDLE TICKER --- */
  .content-wrapper {
    position: relative;
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column; 
    opacity: 0;
    transition: opacity 0.5s;
    visibility: hidden; 
  }

  .content-wrapper.visible {
    opacity: 1;
    visibility: visible;
  }

  .middle-ticker-top {
    position: relative;
    height: 60px; 
    width: 100%;
    overflow: hidden;
    background: #e6e6e6;
  }

  .middle-ticker-bottom {
    position: relative;
    height: 30px; 
    width: 100%;
    background: #222; 
    overflow: hidden;
    display: flex;
    align-items: center;
    border-top: 2px solid #555;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
  }

  .marquee-container {
    white-space: nowrap;
    overflow: hidden;
    width: 100%;
    position: absolute;
    left: 0;
  }

  .marquee-text {
    display: inline-block;
    padding-left: 0; 
    animation: marquee-sequence 40s linear infinite;
    animation-play-state: paused;
    height: 30px;
    line-height: 30px;
  }
  
  .content-wrapper.visible .marquee-text {
    animation-play-state: running;
  }
  
  @keyframes marquee-sequence {
    0% { transform: translateX(0); }        
    100% { transform: translateX(-100%); }  
  }
  
  .marquee-content {
    display: inline-flex;
    align-items: center;
    gap: 20px;
    padding-right: 50px; 
  }
  
  .recap-main-label {
    color: #000;
    background: #ffeb3b; 
    padding: 0 10px;
    font-weight: 900;
    font-size: 16px;
    height: 30px;
    line-height: 30px;
    display: inline-block;
    margin-right: 10px;
  }

  .recap-round {
    color: #fff;
    background: #e23528;
    padding: 0 8px;
    font-weight: 900;
    font-size: 14px;
    border-radius: 4px;
    height: 22px;
    line-height: 22px;
  }
  
  .recap-item {
    color: #fff;
    font-weight: bold;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 6px;
    text-transform: uppercase;
  }
  
  .recap-logo { height: 20px; width: auto; }
  .recap-player { color: #ffeb3b; margin-left: 5px; }

  .ticker-item {
    position: absolute;
    width: 100%;
    left: 0;
    top: 50%;
    transform: translateY(100%);
    font-size: 20px; 
    font-weight: 700;
    color: #111;
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    transition: top 0.7s ease, transform 0.7s ease, opacity 0.7s ease;
    opacity: 0;
    padding-left: 20px;
  }

  .ticker-item.active { top: 50%; transform: translateY(-50%); opacity: 1; }
  .ticker-item.exit { top: 50%; transform: translateY(-150%); opacity: 0; }

  /* --- RIGHT SIDE LEAGUE LOGO --- */
  .logo-box {
    position: absolute;
    top: 0;
    right: 0;
    width: 100%;
    height: 100%;
    background: #dcdcdc;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 15px;
    box-sizing: border-box;
    transition: width 0.7s, padding 0.7s;
    overflow: hidden;
    white-space: nowrap;
    z-index: 10;
    border-left: 2px solid white;
  }

  .logo-box.collapsed { width: 110px; padding: 0; justify-content: center; border-left: 4px solid #fff; background: #ccc; }
  .league-logo { max-height: 55px; max-width: 90px; margin-right: 10px; transition: margin 0.7s; }
  .league-text { font-size: 24px; font-weight: 800; white-space: nowrap; transition: opacity 0.5s; text-transform: uppercase; }
  .logo-box.collapsed .league-text { opacity: 0; display: none; }
  .logo-box.collapsed .league-logo { margin-right: 0; max-height: 65px; max-width: 100px; }

</style>
</head>
<body>

<div class="ticker-bar">
  <div class="info-box hidden-start" id="infoBox">
    <div class="top-row">WAITING FOR DRAFT</div>
    <div class="middle-row">
      <span id="pickText">STANDBY</span>
    </div>
    <div class="timer" id="timer">--:--</div>
  </div>

  <div class="content-wrapper" id="contentWrapper">
    <div class="middle-ticker-top">
      <div class="middle-ticker" id="middleTicker">
          <div class="ticker-item active" id="roster">Roster: No picks yet</div>
          <div class="ticker-item" id="mmrCap">Remaining MMR Cap: —</div>
          <div class="ticker-item" id="bestAvailable1">Best Available: —</div>
          <div class="ticker-item" id="bestAvailable2">Best Available: —</div>
          <div class="ticker-item" id="bestAvailable3">Best Available: —</div>
          <div class="ticker-item" id="bestAvailable4">Best Available: —</div>
      </div>
    </div>
    <div class="middle-ticker-bottom">
        <div class="marquee-container">
            <div class="marquee-text" id="draftRecap">
                <div class="marquee-content" id="marqueeContent">
                    <span class="recap-main-label">DRAFT RECAP</span> WAITING FOR START...
                </div>
            </div>
        </div>
    </div>
  </div>

  <div class="logo-box" id="leagueBox">
    <img src="" class="league-logo" id="leagueLogoImg" alt="LOGO" style="display:none;">
    <span class="league-text" id="leagueText">Clutch Series</span>
  </div>
</div>

<script>
const socket = io();

// Internal state tracking
let previousHistoryLength = 0;
let isRevealing = false;
let currentActiveLeague = null;
let currentActiveRound = 1;
let currentPickIndex = 0;

// Theming Data matching main site
const themes = {
    "Shockwave": "#0984e3",
    "Blasters": "#e67e22",
    "Pirates": "#8b4513",
    "Stars": "#8e44ad",
    "Howlers": "#e84393",
    "Moose": "#d2b48c",
    "Anglers": "#008080",
    "Ninjas": "#1e272e",
    "Samurai": "#c0392b",
    "Flyers": "#27ae60",
    "Vipers": "#f1c40f",
    "Zebras": "#ffffff"
};

const leagueLogos = {
    "CCS": "ClutchCompetitorSeries.png",
    "CPL": "ClutchProspectLeague.png",
    "CAS": "ClutchAmateurSeries.png",
    "CNL": "ClutchNoviceLeague.png"
};

const leagueNames = {
    "CCS": "Clutch Competitor Series",
    "CPL": "Clutch Prospect League",
    "CAS": "Clutch Amateur Series",
    "CNL": "Clutch Novice League"
};

socket.on('stateUpdate', (state) => {
    const draft = state.activeDraft;
    
    if (!draft || !draft.isActive) {
        document.getElementById('infoBox').classList.add('hidden-start');
        document.getElementById('contentWrapper').classList.remove('visible');
        document.getElementById('leagueBox').classList.remove('collapsed');
        document.getElementById('leagueText').innerText = "CLUTCH COMPETITOR SERIES DRAFT SEASON 6";
        previousHistoryLength = 0;
        return;
    }

    // 1. REVEAL ANIMATION CHECK (Did the admin just finalize a pick?)
    const currentHistoryLen = draft.pickHistory ? draft.pickHistory.length : 0;
    if (currentHistoryLen > previousHistoryLength) {
        const lastPick = draft.pickHistory[currentHistoryLen - 1];
        const player = state.players.find(p => p.id === lastPick.playerId);
        const team = state.teams.find(t => t.id === lastPick.teamId);
        
        triggerReveal(team, player, lastPick.round);
    }
    previousHistoryLength = currentHistoryLen;

    // 2. BACKGROUND DATA UPDATES (Always run behind the scenes)
    updateLeagueBox(draft.league);
    updateMiddleTicker(state);
    updateMarquee(state);

    // 3. REGULAR INFO BOX (Only if not currently flashing the Reveal banner)
    if (!isRevealing) {
        updateInfoBox(state);
    }
});

function triggerReveal(team, player, roundNum) {
    isRevealing = true;
    const infoBox = document.getElementById('infoBox');
    // Look up logo based on the specific Team Name, not the Org Name
    const safeName = team.name.toLowerCase().replace(/\s+/g, '');
    
    infoBox.className = "info-box expanded";
    infoBox.style.background = themes[team.org] || "#2c3e50";
    
    infoBox.innerHTML = `
        <div class="expanded-text">
            <img src="logos/${safeName}.png" class="team-logo" onerror="this.style.display='none'">
            <span style="${themes[team.org] === '#ffffff' ? 'color:black; text-shadow:none;' : ''}">
                ${team.name} SELECTS - ${player.name} (${player.mmr})
            </span>
        </div>
    `;
    
    // Hold the banner for 8 seconds, then let the next tick update to the next team
    setTimeout(() => {
        isRevealing = false;
    }, 8000);
}

function updateInfoBox(state) {
    const draft = state.activeDraft;
    const infoBox = document.getElementById('infoBox');
    const currentTeam = draft.teamsInLeague[draft.currentPickIndex];
    // Look up logo based on the specific Team Name, not the Org Name
    const safeName = currentTeam.name.toLowerCase().replace(/\s+/g, '');
    
    const color = themes[currentTeam.org] || "#2c3e50";
    const isLight = color === "#ffffff";

    infoBox.style.background = color;
    infoBox.style.color = isLight ? "#000" : "#fff";

    // Format timer
    let min = Math.floor(draft.timeLeft / 60);
    let sec = draft.timeLeft % 60;
    let timeStr = `${min}:${sec < 10 ? '0' + sec : sec}`;
    let timerClass = draft.timeLeft <= 10 ? "timer critical" : (draft.timeLeft <= 30 ? "timer warning" : "timer");
    
    if (draft.pendingPick) {
        // PICK IS IN STATE
        infoBox.className = "info-box collapsed";
        infoBox.innerHTML = `
            <img src="logos/${safeName}.png" class="team-logo" style="margin-bottom:5px;" onerror="this.style.display='none'">
            <div style="font-weight:900; font-size:16px; ${isLight ? 'text-shadow:none;' : 'text-shadow:1px 1px 0 #000;'}">PICK IS IN</div>
        `;
    } else {
        // ON THE CLOCK STATE
        infoBox.className = "info-box";
        infoBox.innerHTML = `
            <div class="top-row" style="${isLight ? 'text-shadow:none;' : ''}">ON THE CLOCK</div>
            <div class="middle-row">
                <img src="logos/${safeName}.png" class="team-logo" onerror="this.style.display='none'">
                <span id="pickText" style="${isLight ? 'text-shadow:none;' : ''}">RD ${draft.currentRound} - PICK ${draft.currentPickIndex + 1}</span>
            </div>
            <div class="${timerClass}" id="timer" style="${isLight ? 'text-shadow:none;' : ''}">${timeStr}</div>
        `;
    }
}

function updateLeagueBox(leagueKey) {
    document.getElementById('infoBox').classList.remove('hidden-start');
    document.getElementById('contentWrapper').classList.add('visible');
    document.getElementById('leagueBox').classList.add('collapsed');
    
    const logoEl = document.getElementById('leagueLogoImg');
    const textEl = document.getElementById('leagueText');
    
    if (leagueLogos[leagueKey]) {
        logoEl.src = leagueLogos[leagueKey]; 
        logoEl.style.display = "block";
    }
    textEl.innerText = leagueNames[leagueKey] || leagueKey;
}

function updateMiddleTicker(state) {
    const draft = state.activeDraft;
    const currentTeam = draft.teamsInLeague[draft.currentPickIndex];
    const rules = state.leagueConfig[draft.league];

    // 1. Calculate Roster & Remaining Cap
    const cappedRoster = currentTeam.roster.filter(p => p.round <= 3);
    const spent = cappedRoster.reduce((sum, p) => sum + state.players.find(x => x.id === p.id).mmr, 0);
    const rem = currentTeam.mmrCap - spent;
    
    const sortedRoster = [...currentTeam.roster].sort((a,b) => a.round - b.round);
    const rosterStrs = sortedRoster.map(r => {
        const p = state.players.find(x => x.id === r.id);
        return `${p.name} (R${r.round})`;
    });

    document.getElementById('roster').textContent = "Roster: " + (rosterStrs.length > 0 ? rosterStrs.join(" • ") : "No picks yet");
    document.getElementById('mmrCap').textContent = `Remaining Capped MMR: ${rem} / ${currentTeam.mmrCap}`;

    // 2. Best Available Calculation (Filtered to active league constraints)
    const available = state.players
        .filter(p => p.draftedBy === null && p.mmr >= rules.minMmr && p.mmr <= rules.maxMmr)
        .sort((a, b) => b.mmr - a.mmr); // Highest to lowest

    for(let i=1; i<=4; i++) {
        const chunk = available.slice((i-1)*3, i*3);
        const el = document.getElementById(`bestAvailable${i}`);
        
        if (chunk.length > 0) {
            const startRank = (i - 1) * 3 + 1;
            const text = chunk.map((p, index) => `${startRank + index}. ${p.name} (${p.mmr})`).join("  |  ");
            el.textContent = `Best Available: ` + text;
        } else {
            el.textContent = "Best Available: —";
        }
    }
}

function updateMarquee(state) {
    const draft = state.activeDraft;
    const container = document.getElementById('marqueeContent');
    
    let html = `<span class="recap-main-label">DRAFT RECAP</span>`;
    
    for (let r = 1; r <= draft.maxRounds; r++) {
        const picksInRound = draft.draftBoard.filter(p => p.round === r);
        
        // Add round label if there are picks to show in this round
        if (picksInRound.length > 0) {
            html += `<span class="recap-round">ROUND ${r}</span>`;
        }
        
        picksInRound.forEach((pick, index) => {
            if (pick.playerId) {
                const player = state.players.find(p => p.id === pick.playerId);
                // Look up logo based on the specific Team Name, not the Org Name
                const safeTeamName = pick.teamName.toLowerCase().replace(/\s+/g, '');

                html += `
                    <div class="recap-item">
                        ${(r-1)*12 + index + 1}. 
                        <img src="logos/${safeTeamName}.png" class="recap-logo" onerror="this.style.display='none'"> 
                        ${pick.teamName}
                        <span class="recap-player">${player.name}</span>
                    </div>
                `;
            }
        });
    }
    
    // Smooth DOM replacement to keep animation flowing
    const marquee = document.getElementById('draftRecap');
    container.innerHTML = html;
}

// Ticker Animation Loop for Middle Rows
let tickerIndex = 0;
setInterval(() => {
    const items = document.querySelectorAll(".middle-ticker .ticker-item");
    if (items.length === 0) return;
    
    const current = items[tickerIndex];
    current.classList.remove("active");
    current.classList.add("exit");
    
    setTimeout(() => { current.classList.remove("exit"); }, 700);
    
    tickerIndex = (tickerIndex + 1) % items.length;
    items[tickerIndex].classList.add("active");
}, 5000);

</script>
</body>
</html>
